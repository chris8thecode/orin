<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orin | Chat</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/chat.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  </head>
  <body>
    <div id="setupScreen" class="setup-screen">
      <div class="setup-card">
        <h2>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z"
            />
          </svg>
          Orin Chat
        </h2>
        <p>Enter your connected phone number to open your chat view.</p>
        <div class="setup-field">
          <label for="sessionInput">Phone Number</label>
          <input type="text" id="sessionInput" placeholder="e.g. 27831234567" autocomplete="off" />
        </div>
        <button class="setup-btn" id="setupBtn">Open Chat</button>
        <div class="setup-error" id="setupError"></div>
      </div>
    </div>

    <div id="chatApp" class="chat-layout" style="display: none">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h1>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z"
              />
            </svg>
            Orin
          </h1>
          <span class="session-badge" id="sessionBadge"></span>
        </div>
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search chats" autocomplete="off" />
        </div>
        <div class="chat-list" id="chatList"></div>
      </aside>

      <main class="chat-panel" id="chatPanel">
        <div class="chat-panel-empty" id="emptyState">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M8.625 12a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H8.25m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0H12m4.125 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 0 1-2.555-.337A5.972 5.972 0 0 1 5.41 20.97a5.969 5.969 0 0 1-.474-.065 4.48 4.48 0 0 0 .978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z"
            />
          </svg>
          <p>Select a chat to start reading</p>
        </div>

        <div class="active-chat-container" id="activeChat">
          <div class="chat-header">
            <div class="chat-avatar" id="activeChatAvatar">?</div>
            <div class="chat-header-info">
              <div class="chat-header-name" id="activeChatName">Chat</div>
              <div class="chat-header-presence" id="activeChatPresence"></div>
            </div>
          </div>
          <div class="messages-area" id="messagesArea"></div>
          <div class="compose-bar">
            <textarea
              class="compose-input"
              id="composeInput"
              placeholder="Type a message"
              rows="1"
            ></textarea>
            <button class="send-btn" id="sendBtn" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z"
                />
              </svg>
            </button>
          </div>
        </div>
      </main>
    </div>

    <script src="/js/chat.js" defer></script>
  </body>
</html>
